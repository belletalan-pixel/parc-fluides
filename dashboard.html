<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parc Fluides — PAGANETTI THERMIQUE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:#0D2137; --navy2:#1A3A5C;
            --orange:#E05F00; --orange-bg:#FFF0E6;
            --green:#1A6E38;  --green-bg:#E8F5EE;
            --blue:#1A4DB5;   --blue-bg:#EEF4FF;
            --red:#C0392B;    --red-bg:#FDEDEC;
            --amber:#B45309;  --amber-bg:#FFFBEB;
            --bg:#EDF0F3; --card:#fff; --border:#D2D8DF;
            --text:#0D2137; --muted:#6B7A8A;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

        /* Header */
        .header{background:var(--navy);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
        .header-left h1{font-size:17px;font-weight:800;}
        .header-left p{font-size:11px;opacity:.55;margin-top:2px;letter-spacing:.06em;}
        .header-right{display:flex;align-items:center;gap:12px;font-size:12px;opacity:.8;}
        .btn-header{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;text-decoration:none;white-space:nowrap;}
        .btn-header:hover{background:rgba(255,255,255,.25);}

        /* Content */
        .content{max-width:1100px;margin:0 auto;padding:24px 20px;}

        /* Stats */
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
        .stat-card{background:var(--card);border-radius:12px;padding:18px 20px;border:1px solid var(--border);}
        .stat-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
        .stat-val{font-size:38px;font-weight:800;line-height:1;}
        .sc-green .stat-lbl{color:var(--green);} .sc-green .stat-val{color:var(--green);}
        .sc-orange .stat-lbl{color:var(--orange);} .sc-orange .stat-val{color:var(--orange);}
        .sc-blue .stat-lbl{color:var(--blue);} .sc-blue .stat-val{color:var(--blue);}
        .sc-red .stat-lbl{color:var(--red);} .sc-red .stat-val{color:var(--red);}
        .sc-navy .stat-lbl{color:var(--muted);} .sc-navy .stat-val{color:var(--navy);}

        /* Action bar */
        .action-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
        .btn-action{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-family:inherit;}
        .btn-primary{background:var(--navy);color:#fff;}
        .btn-primary:hover{background:var(--navy2);}

        /* Section */
        .section{background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:20px;overflow:hidden;}
        .section-header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);background:#FAFBFC;}
        .section-title{font-size:14px;font-weight:700;}
        .s-badge{font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;}
        .sb-red{background:var(--red-bg);color:var(--red);}
        .sb-orange{background:var(--orange-bg);color:var(--orange);}
        .sb-green{background:var(--green-bg);color:var(--green);}
        .sb-blue{background:var(--blue-bg);color:var(--blue);}
        .sb-navy{background:var(--bg);color:var(--navy);}

        /* Tabs */
        .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 20px;background:#FAFBFC;}
        .tab-btn{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;margin-bottom:-1px;}
        .tab-btn.active{color:var(--navy);border-bottom-color:var(--navy);}

        /* Fluid cards (Neuves) */
        .fluid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:20px;}
        .fluid-card{border:1.5px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:box-shadow .15s,border-color .15s;user-select:none;}
        .fluid-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.09);}
        .fluid-card.open{border-color:var(--navy);}
        .fluid-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
        .fluid-name{font-size:19px;font-weight:800;color:var(--navy);}
        .fluid-arrow{font-size:14px;color:var(--muted);transition:transform .2s;}
        .fluid-card.open .fluid-arrow{transform:rotate(180deg);}
        .fluid-qty{font-size:32px;font-weight:800;color:var(--green);line-height:1;}
        .fluid-qty-unit{font-size:14px;font-weight:600;color:var(--green);}
        .fluid-meta{font-size:12px;color:var(--muted);margin-top:6px;}
        .meta-sortie{color:var(--orange);font-weight:600;}
        .meta-zero{color:var(--red);font-weight:600;}
        .fluid-detail{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:none;}
        .fluid-card.open .fluid-detail{display:block;}
        .detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;gap:8px;}
        .detail-row:last-child{border-bottom:none;}
        .detail-id{font-weight:700;color:var(--navy);}
        .detail-qty{font-weight:600;color:var(--green);}
        .empty-fluid{text-align:center;color:var(--muted);font-size:12px;padding:12px 0;font-style:italic;}

        /* Status pills */
        .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;}
        .pill-stock,.pill-disponible{background:var(--green-bg);color:var(--green);}
        .pill-sortie,.pill-en.sortie{background:var(--orange-bg);color:var(--orange);}
        .pill-attendu{background:var(--blue-bg);color:var(--blue);}

        /* Récup table */
        .table-wrap{overflow-x:auto;}
        table{width:100%;border-collapse:collapse;font-size:13px;}
        th{text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;}
        td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
        tr:last-child td{border-bottom:none;}
        .qty-bar-wrap{display:flex;align-items:center;gap:8px;}
        .qty-bar{background:#DDE3EA;border-radius:4px;height:8px;flex:1;max-width:80px;overflow:hidden;}
        .qty-fill{height:100%;background:var(--orange);border-radius:4px;}
        .qty-val{font-weight:700;font-size:13px;white-space:nowrap;}
        .qty-green{color:var(--green);}
        .qty-muted{color:var(--muted);}
        .tot-row td{background:var(--bg);font-weight:700;}

        /* Alert items */
        .alert-item{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);font-size:13px;}
        .alert-item:last-child{border-bottom:none;}
        .alert-item.warn{background:var(--amber-bg);}
        .alert-id{font-weight:700;min-width:110px;}
        .empty-msg{padding:20px;color:var(--muted);font-size:13px;font-style:italic;text-align:center;}

        /* En sortie table */
        .dur-warn{color:var(--red);font-weight:700;}
        tr.row-warn td{background:var(--red-bg);}

        /* Footer */
        .footer{text-align:center;padding:20px;font-size:11px;color:var(--muted);}

        /* Loading */
        .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:var(--muted);}
        .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}

        @media(max-width:600px){
            .header{padding:14px 16px;}
            .content{padding:16px 12px;}
            .fluid-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px;}
            .stat-val{font-size:28px;}
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <p>PAGANETTI THERMIQUE</p>
        <h1>🧊 Parc à Fluides — Tableau de bord</h1>
    </div>
    <div class="header-right">
        <span id="last-update">—</span>
        <button class="btn-header" onclick="loadData()">⟳ Actualiser</button>
    </div>
</div>

<div class="content" id="content">
    <div class="loading"><div class="spinner"></div><div>Chargement…</div></div>
</div>

<div class="footer">Actualisation automatique toutes les 5 min · Lecture seule</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYoKD0FWNrQ87sbAMn3yLcE-Qej37VYDVwECZFAg65rtA5UdiWzjJMpYn1p-AccUYVnQ/exec';

// ─ State ─────────────────────────────────────────────
let CURRENT_TAB = 'neuf';

// ─ Load ──────────────────────────────────────────────
async function loadData() {
    document.getElementById('last-update').textContent = 'Chargement…';
    try {
        const r = await fetch(`${SCRIPT_URL}?action=getDashboard`);
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        render(d);
        document.getElementById('last-update').textContent = 'Mis à jour : ' + d.updatedAt;
    } catch(err) {
        document.getElementById('content').innerHTML =
            `<div class="loading"><div>❌ Erreur<br><small>${err.message}</small></div></div>`;
        document.getElementById('last-update').textContent = 'Erreur';
    }
}

// ─ Main render ───────────────────────────────────────
function render(d) {
    const bs = d.stock?.byStatut || {};
    const nbStock  = (bs['Stock']||0) + (bs['Disponible']||0);
    const nbSortie = (bs['Sortie']||0) + (bs['En sortie']||0);
    const nbAttendu = bs['Attendu']||0;
    const nbAlertes = (d.alertes||[]).length;

    let html = '';

    // Stats
    html += `<div class="stats">
        <div class="stat-card sc-green"><div class="stat-lbl">En stock</div><div class="stat-val">${nbStock}</div></div>
        <div class="stat-card sc-orange"><div class="stat-lbl">En sortie</div><div class="stat-val">${nbSortie}</div></div>
        <div class="stat-card sc-blue"><div class="stat-lbl">Attendu</div><div class="stat-val">${nbAttendu}</div></div>
        <div class="stat-card ${nbAlertes>0?'sc-red':'sc-navy'}"><div class="stat-lbl">⚠️ Alertes</div><div class="stat-val">${nbAlertes}</div></div>
        <div class="stat-card sc-navy"><div class="stat-lbl">Total parc</div><div class="stat-val">${d.stock?.total||0}</div></div>
    </div>`;

    // Action bar
    html += `<div class="action-bar">
        <a href="qr-generator.html" target="_blank" class="btn-action btn-primary">🏷️ Générer les QR codes</a>
    </div>`;

    // ── État du Stock ────────────────────────────────
    const neufFluides = Object.keys(d.stockNeuf||{}).sort();
    const recupBtls   = d.stockRecup||[];
    html += `<div class="section">
        <div class="section-header">
            <span>📦</span>
            <span class="section-title">État du Stock</span>
            <span class="s-badge sb-navy" style="margin-left:auto">Fluides : ${neufFluides.length} · Récup/Transf : ${recupBtls.length}</span>
        </div>
        <div class="tabs">
            <button class="tab-btn ${CURRENT_TAB==='neuf'?'active':''}" onclick="switchTab('neuf')">🔵 Fluides neufs (${neufFluides.length})</button>
            <button class="tab-btn ${CURRENT_TAB==='recup'?'active':''}" onclick="switchTab('recup')">🔄 Récupération / Transfert (${recupBtls.length})</button>
        </div>
        <div id="panel-neuf" style="display:${CURRENT_TAB==='neuf'?'block':'none'}">
            ${renderNeuves(d.stockNeuf||{})}
        </div>
        <div id="panel-recup" style="display:${CURRENT_TAB==='recup'?'block':'none'}">
            ${renderRecup(recupBtls)}
        </div>
    </div>`;

    // ── Alertes ──────────────────────────────────────
    const alertes = d.alertes||[];
    html += `<div class="section">
        <div class="section-header">
            <span>⚠️</span><span class="section-title">Alertes</span>
            ${alertes.length?`<span class="s-badge sb-red">${alertes.length}</span>`:''}
        </div>`;
    if (!alertes.length) {
        html += `<div class="empty-msg">✅ Aucune alerte — tout est nominal.</div>`;
    } else {
        alertes.forEach(a => {
            html += `<div class="alert-item warn">⚠️
                <span class="alert-id">${a.id}</span>
                <span>${a.fluide}</span>
                <span style="color:var(--muted)">${a.message}</span>
            </div>`;
        });
    }
    html += `</div>`;

    // ── En sortie ────────────────────────────────────
    const enSortie = d.enSortie||[];
    html += `<div class="section">
        <div class="section-header">
            <span>↗</span><span class="section-title">Bouteilles en sortie</span>
            <span class="s-badge sb-orange">${enSortie.length}</span>
            <span style="font-size:11px;color:var(--muted);margin-left:auto">Alerte si > ${d.thresholds?.seuilSortieJours||30} j</span>
        </div>`;
    if (!enSortie.length) {
        html += `<div class="empty-msg">Aucune bouteille en sortie actuellement.</div>`;
    } else {
        html += `<div class="table-wrap"><table>
            <thead><tr><th>N° Bouteille</th><th>Fluide</th><th>Type</th><th>Technicien</th><th>Affaire</th><th>Date sortie</th><th>Durée</th><th>Fluide (kg)</th></tr></thead><tbody>`;
        enSortie.forEach(b => {
            const cls = b.alerte ? ' class="row-warn"' : '';
            html += `<tr${cls}>
                <td><strong>${b.id}</strong></td><td>${b.fluide}</td><td>${b.type}</td>
                <td>${b.technicien||'—'}</td><td>${b.affaire||'—'}</td><td>${b.dateSortie}</td>
                <td class="${b.alerte?'dur-warn':''}">${b.dureeJours!=null?b.dureeJours+'j':'—'}${b.alerte?' ⚠️':''}</td>
                <td>${b.fluideCharge} kg</td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
    }
    html += `</div>`;

    // ── F-Gaz ────────────────────────────────────────
    const fgazFluides = Object.keys(d.fgaz||{}).sort();
    html += `<div class="section">
        <div class="section-header">
            <span>📊</span><span class="section-title">Synthèse F-Gaz ${d.annee}</span>
            <span class="s-badge sb-blue">${fgazFluides.length} fluide(s)</span>
        </div>`;
    if (!fgazFluides.length) {
        html += `<div class="empty-msg">Aucun mouvement en ${d.annee}.</div>`;
    } else {
        let ts=0,tc=0;
        html += `<div class="table-wrap"><table><thead><tr><th>Fluide</th><th>Nb sorties</th><th>Consommation calculée (kg)</th></tr></thead><tbody>`;
        fgazFluides.forEach(f => {
            const fg = d.fgaz[f]; ts+=fg.sorties; tc+=fg.conso;
            html += `<tr><td><strong>${f}</strong></td><td>${fg.sorties}</td><td>${fg.conso.toFixed(3)} kg</td></tr>`;
        });
        html += `</tbody><tfoot><tr class="tot-row"><td>TOTAL</td><td>${ts}</td><td>${tc.toFixed(3)} kg</td></tr></tfoot></table></div>
        <div style="padding:10px 20px;font-size:11px;color:var(--muted);font-style:italic">Données indicatives · Source officielle : portail Fluido Apave.</div>`;
    }
    html += `</div>`;

    document.getElementById('content').innerHTML = html;
}

// ─ Neuves fluid cards ────────────────────────────────
function renderNeuves(stockNeuf) {
    const fluides = Object.keys(stockNeuf).sort();
    if (!fluides.length) return `<div class="empty-msg">Aucune bouteille neuve enregistrée.</div>`;

    let html = `<div class="fluid-grid">`;
    fluides.forEach(fluide => {
        const data = stockNeuf[fluide];
        const nbSortie = (data.bottles||[]).filter(b => b.statut==='Sortie'||b.statut==='En sortie').length;
        const nbStock  = data.nb;
        const total    = typeof data.totalKg === 'number' ? data.totalKg.toFixed(2) : '—';

        const metaLine = nbStock
            ? `${nbStock} bouteille${nbStock>1?'s':''} disponible${nbStock>1?'s':''}`
            : `<span class="meta-zero">0 disponible</span>`;
        const metaSortie = nbSortie ? `<span class="meta-sortie"> · ${nbSortie} en sortie</span>` : '';

        const detailRows = (data.bottles||[]).map(b => {
            const pillCls = b.statut==='Stock'||b.statut==='Disponible' ? 'pill-stock'
                          : b.statut==='Sortie'||b.statut==='En sortie' ? 'pill-sortie'
                          : 'pill-attendu';
            const qtyCls  = b.statut==='Sortie'||b.statut==='En sortie' ? 'qty-muted' : 'detail-qty';
            return `<div class="detail-row">
                <span class="detail-id">${b.id}</span>
                <span class="${qtyCls}">${b.quantite} kg</span>
                <span class="pill ${pillCls}">${b.statut}</span>
            </div>`;
        }).join('');

        html += `<div class="fluid-card" id="fc-${fluide}" onclick="toggleFluid('${fluide}')">
            <div class="fluid-header">
                <span class="fluid-name">${fluide}</span>
                <span class="fluid-arrow">▾</span>
            </div>
            <div class="fluid-qty">${nbStock>0?total:'0.00'} <span class="fluid-qty-unit">kg</span></div>
            <div class="fluid-meta">${metaLine}${metaSortie}</div>
            <div class="fluid-detail">${detailRows||`<div class="empty-fluid">Aucune bouteille</div>`}</div>
        </div>`;
    });
    html += `</div>`;
    return html;
}

function toggleFluid(fluide) {
    document.getElementById('fc-'+fluide).classList.toggle('open');
}

// ─ Récup / Transfert table ───────────────────────────
function renderRecup(btls) {
    if (!btls.length) return `<div class="empty-msg">Aucune bouteille de récupération ou transfert.</div>`;

    let html = `<div class="table-wrap"><table>
        <thead><tr>
            <th>N° Bouteille</th><th>Fluide</th><th>Type</th><th>Statut</th>
            <th>Fluide actuel</th><th>Place disponible</th><th>Capacité max</th>
        </tr></thead><tbody>`;

    btls.forEach(b => {
        const statCls = b.statut==='Stock'||b.statut==='Disponible' ? 'pill-stock'
                      : b.statut==='Sortie'||b.statut==='En sortie' ? 'pill-sortie'
                      : 'pill-attendu';

        let placeHtml = '—';
        if (b.placeDisponible !== null && b.statut !== 'Sortie' && b.statut !== 'En sortie') {
            const capMax = parseFloat(b.capaciteMax)||0;
            const place  = parseFloat(b.placeDisponible)||0;
            const pct    = capMax>0 ? Math.min(100,(place/capMax)*100).toFixed(0) : 0;
            placeHtml = `<div class="qty-bar-wrap">
                <div class="qty-bar"><div class="qty-fill" style="width:${100-pct}%"></div></div>
                <span class="qty-val qty-green">${b.placeDisponible} kg</span>
            </div>`;
        } else if (b.statut==='Sortie'||b.statut==='En sortie') {
            placeHtml = `<span style="color:var(--muted);font-size:12px">En sortie (${b.technicien||'—'})</span>`;
        }

        html += `<tr>
            <td><strong>${b.id}</strong></td>
            <td>${b.fluide}</td>
            <td>${b.type}</td>
            <td><span class="pill ${statCls}">${b.statut}</span></td>
            <td>${b.statut!=='Sortie'&&b.statut!=='En sortie' ? b.fluideActuel+' kg' : '—'}</td>
            <td>${placeHtml}</td>
            <td>${b.capaciteMax ? b.capaciteMax+' kg' : '—'}</td>
        </tr>`;
    });

    html += `</tbody></table></div>`;
    return html;
}

// ─ Tab switch ────────────────────────────────────────
function switchTab(tab) {
    CURRENT_TAB = tab;
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['neuf','recup'][i]===tab));
    document.getElementById('panel-neuf').style.display  = tab==='neuf'  ? 'block' : 'none';
    document.getElementById('panel-recup').style.display = tab==='recup' ? 'block' : 'none';
}

loadData();
setInterval(loadData, 5*60*1000);
</script>
</body>
</html>

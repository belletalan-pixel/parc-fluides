<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parc Fluides — PAGANETTI THERMIQUE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:   #0D2137; --navy2:  #1A3A5C;
            --orange: #E05F00; --orange-bg: #FFF0E6;
            --green:  #1A6E38; --green-bg:  #E8F5EE;
            --blue:   #1A4DB5; --blue-bg:   #EEF4FF;
            --red:    #C0392B; --red-bg:    #FDEDEC;
            --amber:  #B45309; --amber-bg:  #FFFBEB;
            --bg: #EDF0F3; --card: #fff; --border: #D2D8DF;
            --text: #0D2137; --muted: #6B7A8A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* Header */
        .header { background: var(--navy); color: #fff; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .header-left h1 { font-size: 17px; font-weight: 800; }
        .header-left p  { font-size: 11px; opacity: 0.55; margin-top: 2px; letter-spacing: 0.06em; }
        .header-right   { display: flex; align-items: center; gap: 12px; font-size: 12px; opacity: 0.75; }
        .refresh-btn    { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; }
        .refresh-btn:hover { background: rgba(255,255,255,0.25); }

        /* Content */
        .content { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

        /* Stat cards */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: var(--card); border-radius: 12px; padding: 18px 20px; border: 1px solid var(--border); }
        .stat-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
        .stat-val   { font-size: 40px; font-weight: 800; line-height: 1; }
        .stat-card.green  .stat-label { color: var(--green); }  .stat-card.green  .stat-val { color: var(--green); }
        .stat-card.orange .stat-label { color: var(--orange); } .stat-card.orange .stat-val { color: var(--orange); }
        .stat-card.blue   .stat-label { color: var(--blue); }   .stat-card.blue   .stat-val { color: var(--blue); }
        .stat-card.red    .stat-label { color: var(--red); }    .stat-card.red    .stat-val { color: var(--red); }
        .stat-card.navy   .stat-label { color: var(--muted); }  .stat-card.navy   .stat-val { color: var(--navy); }

        /* Sections */
        .section { background: var(--card); border-radius: 14px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
        .section-header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: #FAFBFC; }
        .section-title  { font-size: 14px; font-weight: 700; }
        .section-badge  { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
        .badge-red    { background: var(--red-bg);    color: var(--red); }
        .badge-orange { background: var(--orange-bg); color: var(--orange); }
        .badge-green  { background: var(--green-bg);  color: var(--green); }
        .badge-blue   { background: var(--blue-bg);   color: var(--blue); }

        /* Alertes */
        .alert-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .alert-item:last-child { border-bottom: none; }
        .alert-item.warn { background: var(--amber-bg); }
        .alert-icon { font-size: 16px; margin-top: 1px; }
        .alert-id   { font-weight: 700; min-width: 100px; }
        .alert-msg  { color: var(--muted); }
        .empty-msg  { padding: 20px; color: var(--muted); font-size: 13px; font-style: italic; text-align: center; }

        /* Tables */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr.alerte-row td { background: var(--red-bg); }
        .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .pill-warn { background: var(--red-bg); color: var(--red); }
        .pill-ok   { background: var(--green-bg); color: var(--green); }
        .duree-badge { font-weight: 700; }
        .duree-warn  { color: var(--red); }
        .tot-row td  { background: var(--bg); font-weight: 700; font-size: 13px; }

        /* Footer */
        .footer { text-align: center; padding: 20px; font-size: 11px; color: var(--muted); }

        /* Loading */
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; color: var(--muted); }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .header { padding: 14px 16px; }
            .content { padding: 16px 12px; }
            .stat-val { font-size: 30px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <p>PAGANETTI THERMIQUE</p>
        <h1>🧊 Parc à Fluides — Tableau de bord</h1>
    </div>
    <div class="header-right">
        <span id="last-update">—</span>
        <button class="refresh-btn" onclick="loadData()">⟳ Actualiser</button>
    </div>
</div>

<div class="content" id="content">
    <div class="loading"><div class="spinner"></div><div>Chargement…</div></div>
</div>

<div class="footer">Actualisation automatique toutes les 5 minutes · Lecture seule</div>

<script>
// ── À RENSEIGNER ──────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYoKD0FWNrQ87sbAMn3yLcE-Qej37VYDVwECZFAg65rtA5UdiWzjJMpYn1p-AccUYVnQ/exec';

async function loadData() {
    document.getElementById('last-update').textContent = 'Chargement…';
    try {
        const r = await fetch(`${SCRIPT_URL}?action=getDashboard`);
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        render(d);
        document.getElementById('last-update').textContent = 'Mis à jour : ' + d.updatedAt;
    } catch(err) {
        document.getElementById('content').innerHTML =
            `<div class="loading"><div>❌ Erreur de chargement<br><small>${err.message}</small></div></div>`;
        document.getElementById('last-update').textContent = 'Erreur';
    }
}

function render(d) {
    const bs = d.stock.byStatut || {};
    const nbStock    = (bs['Stock'] || 0) + (bs['Disponible'] || 0);
    const nbSortie   = (bs['Sortie'] || 0) + (bs['En sortie'] || 0);
    const nbAttendu  = bs['Attendu'] || 0;
    const nbAlertes  = d.alertes.length;

    let html = '';

    // ── Stat cards ─────────────────────────────────────────
    html += `<div class="stats">
        <div class="stat-card green">
            <div class="stat-label">En stock</div>
            <div class="stat-val">${nbStock}</div>
        </div>
        <div class="stat-card orange">
            <div class="stat-label">En sortie</div>
            <div class="stat-val">${nbSortie}</div>
        </div>
        <div class="stat-card blue">
            <div class="stat-label">Attendu</div>
            <div class="stat-val">${nbAttendu}</div>
        </div>
        <div class="stat-card ${nbAlertes > 0 ? 'red' : 'navy'}">
            <div class="stat-label">⚠️ Alertes</div>
            <div class="stat-val">${nbAlertes}</div>
        </div>
        <div class="stat-card navy">
            <div class="stat-label">Total parc</div>
            <div class="stat-val">${d.stock.total}</div>
        </div>
    </div>`;

    // ── Alertes ────────────────────────────────────────────
    html += `<div class="section">
        <div class="section-header">
            <span>⚠️</span>
            <span class="section-title">Alertes</span>
            ${nbAlertes > 0 ? `<span class="section-badge badge-red">${nbAlertes}</span>` : ''}
        </div>`;
    if (d.alertes.length === 0) {
        html += `<div class="empty-msg">✅ Aucune alerte — tout est nominal.</div>`;
    } else {
        d.alertes.forEach(a => {
            html += `<div class="alert-item warn">
                <span class="alert-icon">⚠️</span>
                <span class="alert-id">${a.id}</span>
                <span>${a.fluide}</span>
                <span class="alert-msg">${a.message}</span>
            </div>`;
        });
    }
    html += `</div>`;

    // ── En sortie ──────────────────────────────────────────
    html += `<div class="section">
        <div class="section-header">
            <span>↗</span>
            <span class="section-title">Bouteilles en sortie</span>
            <span class="section-badge badge-orange">${d.enSortie.length}</span>
            <span style="font-size:11px;color:var(--muted);margin-left:auto">Alerte si > ${d.thresholds.seuilSortieJours} j</span>
        </div>`;
    if (d.enSortie.length === 0) {
        html += `<div class="empty-msg">Aucune bouteille en sortie actuellement.</div>`;
    } else {
        html += `<div class="table-wrap"><table>
            <thead><tr>
                <th>N° Bouteille</th><th>Fluide</th><th>Type</th>
                <th>Technicien</th><th>Affaire</th><th>Date sortie</th>
                <th>Durée</th><th>Fluide (kg)</th>
            </tr></thead><tbody>`;
        d.enSortie.forEach(b => {
            const alerteCls = b.alerte ? ' class="alerte-row"' : '';
            const dureeCls  = b.alerte ? 'duree-badge duree-warn' : 'duree-badge';
            html += `<tr${alerteCls}>
                <td><strong>${b.id}</strong></td>
                <td>${b.fluide}</td>
                <td>${b.type}</td>
                <td>${b.technicien || '—'}</td>
                <td>${b.affaire || '—'}</td>
                <td>${b.dateSortie}</td>
                <td><span class="${dureeCls}">${b.dureeJours !== null ? b.dureeJours+'j' : '—'}</span>
                    ${b.alerte ? '<span class="pill pill-warn" style="margin-left:6px">⚠️ Long</span>' : ''}</td>
                <td>${b.fluideCharge} kg</td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
    }
    html += `</div>`;

    // ── F-Gaz ──────────────────────────────────────────────
    const fgazFluides = Object.keys(d.fgaz).sort();
    html += `<div class="section">
        <div class="section-header">
            <span>📊</span>
            <span class="section-title">Synthèse F-Gaz ${d.annee}</span>
            <span class="section-badge badge-blue">${fgazFluides.length} fluide(s)</span>
        </div>`;
    if (fgazFluides.length === 0) {
        html += `<div class="empty-msg">Aucun mouvement enregistré en ${d.annee}.</div>`;
    } else {
        let totSorties = 0, totConso = 0;
        html += `<div class="table-wrap"><table>
            <thead><tr>
                <th>Fluide</th><th>Nb sorties</th><th>Consommation calculée (kg)</th>
            </tr></thead><tbody>`;
        fgazFluides.forEach(f => {
            const fg = d.fgaz[f];
            totSorties += fg.sorties;
            totConso   += fg.conso;
            html += `<tr>
                <td><strong>${f}</strong></td>
                <td>${fg.sorties}</td>
                <td>${fg.conso.toFixed(3)} kg</td>
            </tr>`;
        });
        html += `</tbody><tfoot><tr class="tot-row">
            <td>TOTAL</td>
            <td>${totSorties}</td>
            <td>${totConso.toFixed(3)} kg</td>
        </tr></tfoot></table></div>
        <div style="padding:10px 20px;font-size:11px;color:var(--muted);font-style:italic">
            Consommation = différence poids départ/retour (bouteilles neuves). Données indicatives — source officielle : portail Fluido Apave.
        </div>`;
    }
    html += `</div>`;

    document.getElementById('content').innerHTML = html;
}

// Chargement initial + auto-refresh toutes les 5 min
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>

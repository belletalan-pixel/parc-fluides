<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerfa — Parc Fluides PAGANETTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:#0D2137; --navy2:#1A3A5C;
            --brown:#7B4C00; --brown-bg:#FFFBEB; --brown-bdr:#FDE68A;
            --green:#1A6E38; --green-bg:#E8F5EE;
            --orange:#E05F00; --orange-bg:#FFF0E6;
            --red:#C0392B; --red-bg:#FDEDEC;
            --blue:#1A4DB5; --blue-bg:#EEF4FF;
            --bg:#EDF0F3; --card:#fff; --border:#D2D8DF;
            --text:#0D2137; --muted:#6B7A8A;
        }
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

        /* Header */
        .header{background:var(--brown);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;}
        .header-left h1{font-size:16px;font-weight:800;}
        .header-left p{font-size:11px;opacity:.55;margin-top:2px;letter-spacing:.06em;}
        .btn-back{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;font-family:inherit;text-decoration:none;white-space:nowrap;}
        .btn-back:hover{background:rgba(255,255,255,.25);}

        /* Content */
        .content{max-width:1000px;margin:0 auto;padding:24px 20px;}

        /* PIN phase */
        .pin-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:8px;}
        .pin-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px;}
        .pin-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
        .pin-dots{display:flex;gap:18px;justify-content:center;margin:16px 0 8px;}
        .pin-dot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--border);background:transparent;transition:all .12s;}
        .pin-dot.filled{background:var(--brown);border-color:var(--brown);}
        .pin-err{text-align:center;font-size:12px;color:var(--red);min-height:18px;margin-bottom:12px;font-weight:500;}
        @keyframes pshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
        .pshake{animation:pshake .45s ease;}
        .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px;}
        .np-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:18px 8px;font-size:22px;font-weight:700;font-family:inherit;color:var(--navy);cursor:pointer;text-align:center;}
        .np-btn:active{transform:scale(.93);background:#dde2e8;}
        .np-btn.del{font-size:18px;color:var(--red);border-color:transparent;background:transparent;}
        .np-btn.empty{opacity:0;pointer-events:none;}

        /* Management phase */
        .mgmt-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
        .mgmt-stats{font-size:13px;color:var(--muted);}
        .mgmt-stats strong{color:var(--brown);}

        /* Filters */
        .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
        .filter-input{flex:1;min-width:200px;padding:9px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);}
        .filter-input:focus{outline:none;border-color:var(--brown);}
        .filter-btns{display:flex;gap:6px;}
        .fb{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted);}
        .fb.active{border-color:var(--brown);background:var(--brown);color:#fff;}

        /* Bottle accordion */
        .bottle-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
        .bottle-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;gap:12px;}
        .bottle-hdr:hover{background:#FAFBFC;}
        .bottle-name{font-size:15px;font-weight:800;color:var(--navy);}
        .bottle-sub{font-size:12px;color:var(--muted);margin-top:2px;}
        .bottle-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
        .badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;}
        .badge-ok{background:var(--green-bg);color:var(--green);}
        .badge-warn{background:var(--brown-bg);color:var(--brown);}
        .bottle-arr{font-size:14px;color:var(--muted);transition:transform .2s;flex-shrink:0;}
        .bottle-card.open .bottle-arr{transform:rotate(180deg);}
        .bottle-body{display:none;border-top:1px solid var(--border);}
        .bottle-card.open .bottle-body{display:block;}

        /* Movement rows */
        .mvt-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;}
        .mvt-row:last-child{border-bottom:none;}
        .mvt-row:hover{background:var(--brown-bg);}
        .mvt-date{font-size:13px;font-weight:600;color:var(--navy);}
        .mvt-meta{font-size:11px;color:var(--muted);margin-top:3px;}
        .mvt-cerfa-info{font-size:11px;color:var(--muted);margin-top:2px;}
        .mvt-sens{font-size:14px;font-weight:800;white-space:nowrap;}
        .sens-neg{color:var(--green);}
        .sens-pos{color:var(--orange);}
        .mvt-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap;}
        .status-ok{background:var(--green-bg);color:var(--green);}
        .status-ko{background:var(--brown-bg);color:var(--brown);}

        /* Cerfa form */
        .cerfa-form{background:var(--brown-bg);border-top:1px solid var(--brown-bdr);padding:20px 18px;}
        .cerfa-form-title{font-size:13px;font-weight:700;color:var(--brown);margin-bottom:14px;}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
        .form-full{grid-column:1/-1;}
        .fl{display:block;font-size:11px;font-weight:700;color:var(--brown);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
        .fi{width:100%;padding:10px 14px;border:1.5px solid var(--brown-bdr);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);}
        .fi:focus{outline:none;border-color:var(--brown);}
        .fi.dimmed{opacity:.45;}
        .ecart-box{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:700;text-align:center;margin-top:4px;}
        .ecart-ok{background:var(--green-bg);color:var(--green);}
        .ecart-warn{background:var(--red-bg);color:var(--red);}
        .form-actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
        .btn-save{padding:10px 24px;background:var(--brown);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
        .btn-save:hover{opacity:.9;}
        .btn-cancel{padding:10px 16px;background:transparent;color:var(--muted);border:none;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline;}
        .form-err{font-size:12px;color:var(--red);}

        /* Loading */
        .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:14px;color:var(--muted);}
        .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brown);border-radius:50%;animation:spin .7s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}

        .empty-msg{text-align:center;padding:40px;color:var(--muted);font-size:13px;font-style:italic;}

        @media(max-width:600px){
            .header{padding:14px 16px;}
            .content{padding:16px 12px;}
            .mvt-row{grid-template-columns:1fr auto;}
            .mvt-status{display:none;}
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <p>PAGANETTI THERMIQUE</p>
        <h1>📑 Gestion des données Cerfa</h1>
    </div>
    <a href="dashboard.html" class="btn-back">← Tableau de bord</a>
</div>

<!-- PIN phase -->
<div class="content" id="pin-phase">
    <div class="pin-page">
        <div class="pin-title">Accès réservé</div>
        <div class="pin-sub">Saisissez le code d'accès à 4 chiffres</div>
        <div class="pin-dots" id="pin-dots">
            <div class="pin-dot" id="pd1"></div>
            <div class="pin-dot" id="pd2"></div>
            <div class="pin-dot" id="pd3"></div>
            <div class="pin-dot" id="pd4"></div>
        </div>
        <div class="pin-err" id="pin-err"></div>
        <div class="numpad">
            <button class="np-btn" onclick="pressPin('1')">1</button>
            <button class="np-btn" onclick="pressPin('2')">2</button>
            <button class="np-btn" onclick="pressPin('3')">3</button>
            <button class="np-btn" onclick="pressPin('4')">4</button>
            <button class="np-btn" onclick="pressPin('5')">5</button>
            <button class="np-btn" onclick="pressPin('6')">6</button>
            <button class="np-btn" onclick="pressPin('7')">7</button>
            <button class="np-btn" onclick="pressPin('8')">8</button>
            <button class="np-btn" onclick="pressPin('9')">9</button>
            <button class="np-btn empty" disabled></button>
            <button class="np-btn" onclick="pressPin('0')">0</button>
            <button class="np-btn del" onclick="deletePin()">⌫</button>
        </div>
    </div>
</div>

<!-- Management phase -->
<div class="content" id="mgmt-phase" style="display:none">
    <div class="mgmt-header">
        <div class="mgmt-stats" id="mgmt-stats"></div>
        <button class="btn-back" style="background:var(--brown);border-color:var(--brown)" onclick="loadData()">⟳ Actualiser</button>
    </div>

    <div class="filters">
        <input type="text" class="filter-input" id="search-input"
               placeholder="Rechercher une bouteille, affaire, technicien…"
               oninput="applyFilter()"/>
        <div class="filter-btns">
            <button class="fb active" id="fb-all"   onclick="setFilter('all')">Tous</button>
            <button class="fb"        id="fb-ko"    onclick="setFilter('ko')">Manquants</button>
            <button class="fb"        id="fb-ok"    onclick="setFilter('ok')">Saisis</button>
        </div>
    </div>

    <div id="bottles-list">
        <div class="loading"><div class="spinner"></div><div>Chargement…</div></div>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYoKD0FWNrQ87sbAMn3yLcE-Qej37VYDVwECZFAg65rtA5UdiWzjJMpYn1p-AccUYVnQ/exec';
const PIN_CODE   = '1858';

let pin      = '';
let cerfaData = null;
let currentFilter = 'all';
let openBottle    = null; // index of open accordion
let openMvt       = null; // {bi, mi}

// ── PIN ────────────────────────────────────
function pressPin(d) {
    if (pin.length >= 4) return;
    pin += d;
    updateDots();
    document.getElementById('pin-err').textContent = '';
    if (pin.length === 4) setTimeout(checkPin, 160);
}
function deletePin() { pin = pin.slice(0,-1); updateDots(); }
function updateDots() {
    for (let i=1;i<=4;i++)
        document.getElementById('pd'+i).classList.toggle('filled', i<=pin.length);
}
function checkPin() {
    if (pin === PIN_CODE) {
        document.getElementById('pin-phase').style.display = 'none';
        document.getElementById('mgmt-phase').style.display = 'block';
        loadData();
    } else {
        const dots = document.getElementById('pin-dots');
        dots.classList.add('pshake');
        setTimeout(() => {
            pin = ''; updateDots();
            dots.classList.remove('pshake');
            document.getElementById('pin-err').textContent = 'Code incorrect';
        }, 420);
    }
}

// ── Data ────────────────────────────────────
async function loadData() {
    document.getElementById('bottles-list').innerHTML =
        '<div class="loading"><div class="spinner"></div><div>Chargement…</div></div>';
    try {
        const r = await fetch(`${SCRIPT_URL}?action=getCerfaData`);
        cerfaData = await r.json();
        if (cerfaData.error) throw new Error(cerfaData.error);
        renderAll();
    } catch(err) {
        document.getElementById('bottles-list').innerHTML =
            `<div class="empty-msg">❌ ${err.message}</div>`;
    }
}

// ── Filter ──────────────────────────────────
function setFilter(f) {
    currentFilter = f;
    ['all','ko','ok'].forEach(k => {
        document.getElementById('fb-'+k).classList.toggle('active', k===f);
    });
    applyFilter();
}

function applyFilter() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    document.querySelectorAll('.bottle-card').forEach(card => {
        const id    = (card.dataset.id    || '').toLowerCase();
        const fluide= (card.dataset.fluide|| '').toLowerCase();
        const nbKo  = parseInt(card.dataset.nbko  || '0');
        const nbOk  = parseInt(card.dataset.nbok  || '0');

        const matchSearch = !q || id.includes(q) || fluide.includes(q)
            || card.dataset.mvttext?.toLowerCase().includes(q);
        const matchFilter = currentFilter==='all'
            || (currentFilter==='ko' && nbKo>0)
            || (currentFilter==='ok' && nbOk>0 && nbKo===0);

        card.style.display = (matchSearch && matchFilter) ? '' : 'none';
    });
}

// ── Render ──────────────────────────────────
function renderAll() {
    const bottles = cerfaData.bottles || [];
    const totalMvt = bottles.reduce((s,b) => s+b.movements.length, 0);
    const totalKo  = bottles.reduce((s,b) => s+b.movements.filter(m=>!m.cerfaSaisi).length, 0);

    document.getElementById('mgmt-stats').innerHTML =
        `${bottles.length} bouteille(s) · ${totalMvt} mouvement(s) · <strong>${totalKo} Cerfa manquant(s)</strong>`;

    if (!bottles.length) {
        document.getElementById('bottles-list').innerHTML =
            '<div class="empty-msg">Aucun mouvement avec variation de fluide.</div>';
        return;
    }

    let html = '';
    bottles.forEach((b, bi) => {
        const nbKo    = b.movements.filter(m=>!m.cerfaSaisi).length;
        const nbOk    = b.movements.filter(m=>m.cerfaSaisi).length;
        const mvtText = b.movements.map(m=>m.affaire+' '+m.technicien).join(' ');

        html += `<div class="bottle-card" id="bottle-${bi}"
            data-id="${b.id}" data-fluide="${b.fluide||''}"
            data-nbko="${nbKo}" data-nbok="${nbOk}"
            data-mvttext="${mvtText}">
            <div class="bottle-hdr" onclick="toggleBottle(${bi})">
                <div>
                    <div class="bottle-name">${b.id}</div>
                    <div class="bottle-sub">${b.fluide||'?'} · ${b.type} · ${b.movements.length} mouvement(s)</div>
                </div>
                <div class="bottle-badges">
                    ${nbKo>0 ? `<span class="badge badge-warn">⚠️ ${nbKo} manquant(s)</span>` : ''}
                    ${nbOk>0 ? `<span class="badge badge-ok">✓ ${nbOk} saisi(s)</span>` : ''}
                </div>
                <span class="bottle-arr">▾</span>
            </div>
            <div class="bottle-body" id="body-${bi}">`;

        b.movements.forEach((m, mi) => {
            const isPos   = m.sens.startsWith('+');
            const sensCls = isPos ? 'sens-pos' : 'sens-neg';
            const statusCls  = m.cerfaSaisi ? 'status-ok' : 'status-ko';
            const statusLabel= m.cerfaSaisi ? '✓ Cerfa saisi' : 'Cerfa manquant';
            const cerfaInfo  = m.cerfaSaisi && m.cerfa
                ? `N° ${m.cerfa.noCerfa} · ${m.cerfa.motif}`
                : '';

            html += `<div class="mvt-row" onclick="toggleForm(${bi},${mi})">
                <div>
                    <div class="mvt-date">${m.date}</div>
                    <div class="mvt-meta">📋 ${m.affaire} &nbsp;·&nbsp; 👤 ${m.technicien}</div>
                    ${cerfaInfo ? `<div class="mvt-cerfa-info">${cerfaInfo}</div>` : ''}
                </div>
                <span class="mvt-sens ${sensCls}">${m.sens}</span>
                <span class="mvt-status ${statusCls}">${statusLabel}</span>
            </div>
            <div id="form-${bi}-${mi}" style="display:none">
                ${buildForm(b, m, bi, mi)}
            </div>`;
        });

        html += `</div></div>`;
    });

    document.getElementById('bottles-list').innerHTML = html;
    applyFilter();
}

function toggleBottle(bi) {
    const card = document.getElementById('bottle-'+bi);
    if (!card) return;
    const wasOpen = card.classList.contains('open');
    // Fermer tous
    document.querySelectorAll('.bottle-card').forEach(c => c.classList.remove('open'));
    if (!wasOpen) card.classList.add('open');
}

function toggleForm(bi, mi) {
    // Fermer autres formulaires de la même bouteille
    document.querySelectorAll(`[id^="form-${bi}-"]`).forEach(el => {
        if (el.id !== `form-${bi}-${mi}`) el.style.display = 'none';
    });
    const form = document.getElementById(`form-${bi}-${mi}`);
    if (!form) return;
    const isOpen = form.style.display !== 'none';
    form.style.display = isOpen ? 'none' : 'block';
    // Ouvrir l'accordéon
    if (!isOpen) {
        const card = document.getElementById('bottle-'+bi);
        if (card) card.classList.add('open');
    }
}

function buildForm(b, m, bi, mi) {
    const isRec = b.type === 'Récupération' || b.type === 'Transfert';
    const c = m.cerfa || {};
    return `<div class="cerfa-form">
        <div class="cerfa-form-title">
            📑 Données Cerfa — ${m.date} · ${m.affaire}
            <span style="font-weight:400;color:var(--muted)"> · Conso théorique : ${m.sens}</span>
        </div>
        <div class="form-grid">
            <div class="form-full">
                <label class="fl">N° Cerfa <span style="font-weight:400;font-style:italic">(peut être partagé entre plusieurs mouvements)</span></label>
                <input class="fi" id="fi-no-${bi}-${mi}" value="${c.noCerfa||''}" placeholder="ex : 2025-147" autocomplete="off"/>
            </div>
            <div class="form-full">
                <label class="fl">Motif d'intervention</label>
                <input class="fi" id="fi-motif-${bi}-${mi}" value="${c.motif||''}" placeholder="ex : Recharge, Récupération avant réparation…" autocomplete="off"/>
            </div>
            <div>
                <label class="fl">Qté récupérée Cerfa (kg)</label>
                <input class="fi ${!isRec?'dimmed':''}" id="fi-recup-${bi}-${mi}" type="number"
                    step="0.001" min="0" value="${c.qtRecup||''}" placeholder="0.000"
                    ${!isRec?'tabindex="-1"':''}/>
                ${!isRec?'<div style="font-size:11px;color:var(--muted);margin-top:4px">Non applicable pour une bouteille Neuf</div>':''}
            </div>
            <div>
                <label class="fl">Qté rechargée Cerfa (kg)</label>
                <input class="fi ${isRec?'dimmed':''}" id="fi-recharge-${bi}-${mi}" type="number"
                    step="0.001" min="0" value="${c.qtRecharge||''}" placeholder="0.000"
                    ${isRec?'tabindex="-1"':''}/>
                ${isRec?'<div style="font-size:11px;color:var(--muted);margin-top:4px">Non applicable pour ce type</div>':''}
            </div>
            <div class="form-full">
                <label class="fl">Opérateur (technicien ayant réalisé l'intervention)</label>
                <input class="fi" id="fi-ope-${bi}-${mi}" value="${c.operateur||m.technicien}" autocomplete="off"/>
            </div>
        </div>
        <div id="fi-ecart-${bi}-${mi}"></div>
        <div class="form-actions">
            <button class="btn-save" onclick="submitCerfa(${bi},${mi})">✔ Enregistrer</button>
            <button class="btn-cancel" onclick="toggleForm(${bi},${mi})">Annuler</button>
            <span class="form-err" id="fi-err-${bi}-${mi}"></span>
        </div>
    </div>`;
}

async function submitCerfa(bi, mi) {
    const b = (cerfaData.bottles||[])[bi];
    const m = b ? b.movements[mi] : null;
    if (!b || !m) return;

    const noCerfa    = document.getElementById(`fi-no-${bi}-${mi}`)?.value.trim();
    const motif      = document.getElementById(`fi-motif-${bi}-${mi}`)?.value.trim();
    const qtRecup    = parseFloat(document.getElementById(`fi-recup-${bi}-${mi}`)?.value) || 0;
    const qtRecharge = parseFloat(document.getElementById(`fi-recharge-${bi}-${mi}`)?.value) || 0;
    const operateur  = document.getElementById(`fi-ope-${bi}-${mi}`)?.value.trim();
    const errEl      = document.getElementById(`fi-err-${bi}-${mi}`);
    const ecartEl    = document.getElementById(`fi-ecart-${bi}-${mi}`);

    if (!noCerfa)   { errEl.textContent = 'Saisissez le N° Cerfa.'; return; }
    if (!motif)     { errEl.textContent = 'Saisissez le motif.'; return; }
    if (!operateur) { errEl.textContent = "Saisissez l'opérateur."; return; }
    errEl.textContent = '';

    const isRec = b.type === 'Récupération' || b.type === 'Transfert';
    const ecart = isRec
        ? parseFloat((qtRecup - m.conso).toFixed(3))
        : parseFloat((m.conso - qtRecharge).toFixed(3));

    // Afficher l'écart
    const ecartCls = Math.abs(ecart) > 0.5 ? 'ecart-warn' : 'ecart-ok';
    ecartEl.innerHTML = `<div class="ecart-box ${ecartCls}" style="margin-top:12px">
        Écart théorique / Cerfa : <strong>${ecart>=0?'+':''}${ecart.toFixed(3)} kg</strong>
        ${Math.abs(ecart) > 0.5 ? ' ⚠️ Écart supérieur à 0.5 kg — à vérifier' : ' ✓ Cohérent'}
    </div>`;

    const payload = {
        ref: m.ref, bottleId: b.id, fluide: b.fluide, type: b.type,
        date: m.date, affaire: m.affaire, technicien: m.technicien,
        consoTheo: m.conso, noCerfa, motif, qtRecup, qtRecharge, operateur,
    };

    const btn = document.querySelector(`#form-${bi}-${mi} .btn-save`);
    if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }

    try {
        const url = new URL(SCRIPT_URL);
        url.searchParams.set('action', 'saveCerfa');
        url.searchParams.set('data', JSON.stringify(payload));
        const r = await fetch(url.toString());
        const res = await r.json();
        if (res.error) throw new Error(res.error);
        await loadData(); // Rafraîchir tout
    } catch(err) {
        errEl.textContent = '❌ ' + err.message;
        if (btn) { btn.disabled = false; btn.textContent = '✔ Enregistrer'; }
    }
}
</script>
</body>
</html>
